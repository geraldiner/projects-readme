name: Update READMEs

on:
  workflow_dispatch:
  push:
    paths:
      - "projects.md"
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Set up NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Run main script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm start || exit 0
